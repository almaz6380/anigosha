<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <!-- „Zum Home-Bildschirm hinzufügen“ auf iOS nutzt genau dieses Bild -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Startwert; die Startseite setzt ihn zur Laufzeit auf den Himmelston -->
    <meta name="theme-color" content="#0f0a1e" />
    <!-- Nach „Zum Home-Bildschirm hinzufügen“ zeichnet die App bis unter die Statusleiste -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Anigosha — Anime Quiz &amp; Duelle</title>
    <meta
      name="description"
      content="804 Fragen aus 12 Anime-Kategorien, tägliche Challenge und rundenbasierte Duelle. Sofort im Browser spielbar."
    />

    <!--
      Vorschau fuer geteilte Links (WhatsApp, Discord, X, Facebook).
      Ohne diese Angaben zeigen alle genannten Dienste nur die nackte Adresse —
      ein geteiltes Ergebnis sieht dann aus wie ein toter Link.
      Die Bildadresse MUSS absolut sein: Die Vorschau-Dienste rufen sie ohne
      Seitenkontext ab und koennen relative Pfade nicht aufloesen.
      Bild neu erzeugen mit: node tools/og-image.mjs
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Anigosha" />
    <meta property="og:url" content="https://anigosha.vercel.app/" />
    <meta property="og:title" content="Anigosha — Anime Quiz &amp; Duelle" />
    <meta
      property="og:description"
      content="804 Fragen aus 12 Anime-Kategorien, tägliche Challenge und Duelle. Sofort im Browser spielbar."
    />
    <meta property="og:image" content="https://anigosha.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Anigosha — Anime Quiz &amp; Duelle" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Anigosha — Anime Quiz &amp; Duelle" />
    <meta
      name="twitter:description"
      content="804 Fragen aus 12 Anime-Kategorien, tägliche Challenge und Duelle. Sofort im Browser spielbar."
    />
    <meta name="twitter:image" content="https://anigosha.vercel.app/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
