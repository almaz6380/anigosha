# Einen bereits hochgeladenen Build in einen anderen Play-Track heben —
# ohne ihn neu zu bauen.
#
# Warum getrennt von "Android Release": Dort wird immer gebaut, und ein
# neuer Build braucht einen neuen versionCode. Fuer den Weg vom internen
# Test in die Produktion ist das falsch — dort soll GENAU der Build live
# gehen, der getestet wurde, mit derselben Nummer.
name: Play Promote

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode, der gehoben werden soll (z. B. 4)'
        type: string
        required: true
      track:
        description: 'Zieltrack'
        type: choice
        default: 'internal'
        options: ['internal', 'alpha', 'beta', 'production']
      notes:
        description: 'Was-ist-neu-Text (de-DE)'
        type: string
        default: 'Fehlerkorrekturen und Verbesserungen.'
      dry_run:
        description: 'Nur zeigen, nichts an Google senden'
        type: boolean
        default: true
      laeufer:
        description: 'Wo laufen? github = GitHub-Rechner (kostet Minuten), mac = eigener Mac (Self-hosted Runner)'
        type: choice
        default: 'github'
        options: ['github', 'mac']

permissions:
  contents: read

jobs:
  promote:
    runs-on: ${{ inputs.laeufer == 'mac' && fromJSON('["self-hosted", "macOS"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Abhaengigkeiten
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography

      - name: Stand vorher
        env:
          PLAY_KEY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          TRACK: ${{ inputs.track }}
        run: |
          printf '%s' "$PLAY_KEY_JSON" > "$RUNNER_TEMP/play-key.json"
          PLAY_KEY="$RUNNER_TEMP/play-key.json" "$RUNNER_TEMP/venv/bin/python" scripts/play-upload.py \
            --status --track "$TRACK"
          rm -f "$RUNNER_TEMP/play-key.json"

      - name: Hochstufen
        if: ${{ !inputs.dry_run }}
        env:
          PLAY_KEY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VC: ${{ inputs.version_code }}
          TRACK: ${{ inputs.track }}
          NOTES: ${{ inputs.notes }}
        run: |
          printf '%s' "$PLAY_KEY_JSON" > "$RUNNER_TEMP/play-key.json"
          PLAY_KEY="$RUNNER_TEMP/play-key.json" "$RUNNER_TEMP/venv/bin/python" scripts/play-upload.py \
            --promote "$VC" --track "$TRACK" --complete --notes "$NOTES"
          rm -f "$RUNNER_TEMP/play-key.json"

      - name: Aufraeumen
        if: always()
        run: rm -rf "$RUNNER_TEMP/play-key.json" "$RUNNER_TEMP/venv"
