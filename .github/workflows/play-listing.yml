name: Play-Eintrag aktualisieren

# Nur manuell. Der Store-Eintrag ist oeffentlich — den aendert man absichtlich,
# nicht als Nebenwirkung eines Push. Standard ist der Trockenlauf.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Was aktualisiert wird'
        type: choice
        options: [screenshots, texte, texte-lesen, grafiken, standardsprache]
        default: screenshots
      lang:
        description: 'Sprache des Store-Eintrags'
        default: 'de-DE'
        required: true
      dry_run:
        description: 'Trockenlauf (nur anzeigen, nichts aendern)'
        type: boolean
        default: true

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Abhaengigkeiten
        # Eigene venv: auf dem Mac verweigert das System-Python ein pip install.
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Play-Eintrag aktualisieren
        env:
          # Der Schluessel verlaesst die GitHub-Secrets nicht. Er wird nur in die
          # Datei geschrieben, die scripts/play-upload.py erwartet.
          PLAY_KEY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          MODE: ${{ inputs.mode }}
          LANG_INPUT: ${{ inputs.lang }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -z "${PLAY_KEY_JSON:-}" ]; then
            echo "Secret PLAY_SERVICE_ACCOUNT_JSON fehlt im Repository." >&2
            exit 1
          fi
          # Unter RUNNER_TEMP, nicht im Home: auf dem eigenen Mac darf der Lauf
          # nichts Privates anfassen (wie play-promote).
          printf '%s' "$PLAY_KEY_JSON" > "$RUNNER_TEMP/play-key.json"
          export PLAY_KEY="$RUNNER_TEMP/play-key.json"

          GEMEINSAM=(--lang "$LANG_INPUT")
          if [ "$DRY_RUN" = "true" ]; then
            GEMEINSAM+=(--dry-run)
            echo "::notice::Trockenlauf — es wird nichts am Store-Eintrag geaendert."
          else
            echo "::warning::Echter Lauf — der oeffentliche Play-Eintrag wird jetzt geaendert."
          fi

          case "$MODE" in
            standardsprache)
              # lang wird zur Standardsprache (Rueckfall fuer alle Laender).
              python3 scripts/play-upload.py --standardsprache "${GEMEINSAM[@]}"
              ;;
            texte-lesen)
              python3 scripts/play-upload.py --listing-lesen --lang "$LANG_INPUT"
              ;;
            texte)
              python3 scripts/play-upload.py \
                --listing "store-assets/play-listing.$LANG_INPUT.json" "${GEMEINSAM[@]}"
              ;;
            grafiken)
              # App-Symbol und Vorstellungsgrafik sind zwei getrennte Uploads;
              # jeder braucht seine eigene Edit-Transaktion.
              python3 scripts/play-upload.py \
                --icon store-assets/icon/icon-512.png "${GEMEINSAM[@]}"
              echo
              if [ -f store-assets/icon/feature-graphic.png ]; then
                python3 scripts/play-upload.py \
                  --feature store-assets/icon/feature-graphic.png "${GEMEINSAM[@]}"
              else
                echo "::notice::Keine Vorstellungsgrafik im Repo — uebersprungen."
              fi
              ;;
            *)
              # Store-Bilder sind je Sprache eigene Bilder. Die Saetze liegen
              # unter store-assets/play/<code>; fehlt die Sprache, wird der
              # englische genommen (tools/store-shots-pruefstand.mjs erzeugt sie).
              CODE="${LANG_INPUT%%-*}"
              ORDNER="store-assets/play/$CODE"
              [ -d "$ORDNER" ] || ORDNER="store-assets/play/en"
              echo "Bilder aus $ORDNER"
              python3 scripts/play-upload.py \
                --screenshots "$ORDNER" "${GEMEINSAM[@]}"
              ;;
          esac

      - name: Schluessel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/play-key.json"
