name: Migrationen einspielen

# Nur manuell. Migrationen aendern die Produktivdatenbank — das passiert
# absichtlich, nicht als Nebenwirkung eines Push. Standard ist der Trockenlauf.
on:
  workflow_dispatch:
    inputs:
      gruppe:
        description: 'Welche Sprachpakete'
        type: choice
        options: [es, fr, pt, alle]
        default: es
      dry_run:
        description: 'Trockenlauf (begin/rollback, aendert nichts)'
        type: boolean
        default: true

jobs:
  migrieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Migrationen
        env:
          # Der Token verlaesst die GitHub-Secrets nicht; tools/run-sql.mjs
          # liest ihn aus der Umgebung, wenn keine .env da ist.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "Secret SUPABASE_ACCESS_TOKEN fehlt."
            echo "Anlegen unter Settings -> Secrets and variables -> Actions."
            echo "Wert erzeugen unter https://supabase.com/dashboard/account/tokens"
            exit 1
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node tools/migrationen.mjs --gruppe "${{ inputs.gruppe }}"
          else
            node tools/migrationen.mjs --gruppe "${{ inputs.gruppe }}" --echt
          fi
